name: Verificação do simulador

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Testes e fontes (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter repositório e histórico para verificação de fontes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Executar a suíte
        run: python -B -m unittest discover -s tests -q
      - name: Conferir fontes de resultados históricos
        run: python -B -m scripts.verify_sources
      - name: Conferir estudo experimental de Ram e Crossbones parcial
        run: python -B -m scripts.audit_ram_crossbones_explore experimental_outputs/ram_crossbones_explore_v1.json
